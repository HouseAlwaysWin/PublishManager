name: Release

on:
  push:
    tags:
      - 'v*'

# Required so the workflow can create a Release with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PublishManager.slnx

      - name: Build (Release)
        run: dotnet build PublishManager.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PublishManager.slnx -c Release --no-build

      - name: Publish (win-x64, self-contained single file)
        run: >
          dotnet publish src/PublishManager/PublishManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $asset = 'publish/win-x64/PublishManager.exe'
          $ghArgs = @('release', 'create', $tag, $asset, '--title', $tag, '--generate-notes')
          if ($tag -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs
